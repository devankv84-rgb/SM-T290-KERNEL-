name: Build SM-T290 Kernel from Drive (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Cross-Compilers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            git \
            wget \
            zip \
            unzip \
            lzop \
            perl \
            rsync \
            kmod \
            device-tree-compiler \
            ccache \
            python3 \
            python3-pip \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          
          pip install --upgrade pip
          pip install gdown

      - name: Download Kernel Source Zip from Google Drive
        run: |
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          echo "Downloading kernel source zip via gdown..."
          gdown "https://drive.google.com/uc?id=$FILE_ID" -O kernel-source.zip
          
          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source

      - name: Clone RTL88xxau Driver into Kernel Tree
        run: |
          cd kernel-source/* || cd kernel-source
          mkdir -p drivers/net/wireless/realtek
          git clone https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/realtek/rtl88xxau

      - name: Clone LineageOS Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain-clang

      - name: Compile Kernel, Explicitly Build Drivers, and Install Modules
        run: |
          cd kernel-source/* || cd kernel-source
          
          CLANG_PATH="${{ github.workspace }}/toolchain-clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -Wno-unused-command-line-argument"
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          
          mkdir -p out
          echo "-iam_devu" > localversion
          
          # Generate Defconfig
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # Configure driver and WLAN feature flags
          grep -q "CONFIG_QCACLD_WLAN" out/.config && sed -i 's/CONFIG_QCACLD_WLAN=.*/CONFIG_QCACLD_WLAN=y/g' out/.config || echo "CONFIG_QCACLD_WLAN=y" >> out/.config
          grep -q "CONFIG_RTL88XXAU" out/.config && sed -i 's/CONFIG_RTL88XXAU=.*/CONFIG_RTL88XXAU=m/g' out/.config || echo "CONFIG_RTL88XXAU=m" >> out/.config
          grep -q "CONFIG_CFG80211" out/.config && sed -i 's/CONFIG_CFG80211=.*/CONFIG_CFG80211=m/g' out/.config || echo "CONFIG_CFG80211=m" >> out/.config
          grep -q "CONFIG_MAC80211" out/.config && sed -i 's/CONFIG_MAC80211=.*/CONFIG_MAC80211=m/g' out/.config || echo "CONFIG_MAC80211=m" >> out/.config
          grep -q "CONFIG_WLAN_FEATURE_P2P" out/.config && sed -i 's/CONFIG_WLAN_FEATURE_P2P=.*/CONFIG_WLAN_FEATURE_P2P=y/g' out/.config || echo "CONFIG_WLAN_FEATURE_P2P=y" >> out/.config
          grep -q "CONFIG_PRIMA_WLAN_OKC" out/.config && sed -i 's/CONFIG_PRIMA_WLAN_OKC=.*/CONFIG_PRIMA_WLAN_OKC=y/g' out/.config || echo "CONFIG_PRIMA_WLAN_OKC=y" >> out/.config
          grep -q "CONFIG_COMPAT=y" out/.config || echo "CONFIG_COMPAT=y" >> out/.config
          grep -q "CONFIG_SYSVIPC_COMPAT=y" out/.config || echo "CONFIG_SYSVIPC_COMPAT=y" >> out/.config
          
          # Inject P2P fallback definitions into macTrace.c to bypass undeclared errors
          sed -i '/#include "macTrace.h"/a \
          #define P2P_NOT_ACTIVE 0 \
          #define P2P_GO_NEG_PROCESS 1 \
          #define P2P_GO_NEG_COMPLETED 2 \
          #define P2P_CLIENT_CONNECTING_STATE_1 3 \
          #define P2P_GO_COMPLETED_STATE 4 \
          #define P2P_CLIENT_CONNECTED_STATE_1 5 \
          #define P2P_CLIENT_DISCONNECTED_STATE 6 \
          #define P2P_CLIENT_CONNECTING_STATE_2 7 \
          #define P2P_CLIENT_COMPLETED_STATE 8' drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c
          
          # Build kernel image
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Explicitly compile out-of-tree rtl88xxau module against output config
          make -j$(nproc) O=out ARCH=arm64 \
            M=drivers/net/wireless/realtek/rtl88xxau \
            modules

      - name: Package with AnyKernel3
        run: |
          cd ${{ github.workspace }}
          
          rm -rf anykernel
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
          
          mkdir -p compiled_output
          find kernel-source -name "Image.gz" -exec cp {} compiled_output/ \; || true
          find kernel-source -name "Image" -exec cp {} compiled_output/ \; || true
          
          if [ -f "compiled_output/Image.gz" ]; then
            cp compiled_output/Image.gz anykernel/
          else
            cp compiled_output/Image anykernel/
          fi
          
          # Stage vendor modules directory inside AnyKernel3 using wildcard .ko search
          mkdir -p anykernel/modules/vendor/lib/modules/
          
          echo "Searching for all compiled driver modules (*.ko)..."
          find kernel-source -name "*.ko" -print -exec cp {} anykernel/modules/vendor/lib/modules/ \; || true
          
          echo "Files currently staged in AnyKernel3 modules:"
          ls -la anykernel/modules/vendor/lib/modules/
          
          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/device\.name1=.*/device\.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *
          cd ${{ github.workspace }}
          
          mkdir -p final_zip
          mv SM-T290-Lineage20-AnyKernel3-iam_devu.zip final_zip/

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: final_zip/*.zip
          
