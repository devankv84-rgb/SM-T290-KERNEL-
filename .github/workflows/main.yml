name: Build SM-T290 Kernel from Drive (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'
      rtl_branch:
        description: 'rtl8812au branch/tag (v5.6.4.2 suits old kernels)'
        required: true
        default: 'v5.6.4.2'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Cross-Compilers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          pip install --upgrade pip
          pip install gdown

      - name: Download Kernel Source Zip from Google Drive
        run: |
          set -eo pipefail
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          echo "Downloading kernel source zip via gdown..."
          gdown "https://drive.google.com/uc?id=$FILE_ID" -O kernel-source.zip

          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source

      - name: Locate Kernel Root
        run: |
          set -eo pipefail
          # Kernel root = directory that contains an "arch" folder
          KROOT=$(find "$GITHUB_WORKSPACE/kernel-source" -maxdepth 3 -type d -name arch -printf '%h\n' | head -n1)
          if [ -z "$KROOT" ] || [ ! -f "$KROOT/Makefile" ]; then
            echo "Error: could not locate kernel root (Makefile + arch/)"
            exit 1
          fi
          echo "Kernel root: $KROOT"
          echo "KERNEL_ROOT=$KROOT" >> $GITHUB_ENV

      - name: Clone RTL88xxau Driver Out-of-Tree
        run: |
          set -eo pipefail
          git clone --depth=1 -b "${{ github.event.inputs.rtl_branch }}" \
            https://github.com/aircrack-ng/rtl8812au.git "$KERNEL_ROOT/drivers/rtl8812au"

      - name: Clone LineageOS Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain-clang

      - name: Compile Kernel Image, Modules, and Out-of-Tree Driver
        run: |
          set -eo pipefail
          cd "$KERNEL_ROOT"

          export PATH="${{ github.workspace }}/toolchain-clang/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -Wno-unused-command-line-argument"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip

          mkdir -p out
          echo "-iam_devu" > localversion

          # Generate defconfig
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}

          # Apply config changes with the kernel's own script, then resolve dependencies
          scripts/config --file out/.config \
            -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_UNLOAD \
            -e USB -e USB_SUPPORT \
            -m CFG80211 -e CFG80211_WEXT -m MAC80211 \
            -e COMPAT -e SYSVIPC_COMPAT \
            -e QCACLD_WLAN -e WLAN_FEATURE_P2P -e PRIMA_WLAN_OKC || true
          make O=out ARCH=arm64 olddefconfig

          echo "=== Resulting key config values ==="
          grep -E "^CONFIG_(MODULES|USB|CFG80211|MAC80211|COMPAT)=" out/.config || true

          # Inject P2P fallback definitions into macTrace.c (only if the file exists)
          MACTRACE="drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c"
          if [ -f "$MACTRACE" ]; then
            cat > /tmp/p2p_defs.txt <<'EOF'
          #define P2P_NOT_ACTIVE 0
          #define P2P_GO_NEG_PROCESS 1
          #define P2P_GO_NEG_COMPLETED 2
          #define P2P_CLIENT_CONNECTING_STATE_1 3
          #define P2P_GO_COMPLETED_STATE 4
          #define P2P_CLIENT_CONNECTED_STATE_1 5
          #define P2P_CLIENT_DISCONNECTED_STATE 6
          #define P2P_CLIENT_CONNECTING_STATE_2 7
          #define P2P_CLIENT_COMPLETED_STATE 8
          EOF
            sed -i 's/^[[:space:]]*#define/#define/' /tmp/p2p_defs.txt
            sed -i '/#include "macTrace.h"/r /tmp/p2p_defs.txt' "$MACTRACE"
          fi

          # 1. Kernel image + device trees
          make -j$(nproc) O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-

          # 2. In-tree modules
          make -j$(nproc) O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- modules

          # 3. Prepare tree for external module builds
          make O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- modules_prepare

          # 4. Out-of-tree rtl8812au
          #    - CONFIG_88XXAU=m is required: with KERNELRELEASE set, the driver Makefile
          #      only builds obj-$(CONFIG_88XXAU), which is otherwise undefined (empty build)
          #    - CONFIG_PLATFORM_I386_PC=n overrides the x86 default platform
          echo "=== Driver Makefile obj lines ==="
          grep -nE "obj-|CONFIG_88XXAU|MODULE_NAME" drivers/rtl8812au/Makefile | head -n 20 || true

          make -j$(nproc) -C out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            M="$KERNEL_ROOT/drivers/rtl8812au" \
            CONFIG_88XXAU=m \
            CONFIG_PLATFORM_I386_PC=n \
            modules V=1 2>&1 | tee "${{ github.workspace }}/rtl8812au-build.log"

          echo "=== Built driver files ==="
          ls -la "$KERNEL_ROOT"/drivers/rtl8812au/*.ko   # fails loudly if missing
          modinfo "$KERNEL_ROOT"/drivers/rtl8812au/88XXau.ko | grep -E "vermagic|filename" || true

      - name: Package with AnyKernel3
        run: |
          set -eo pipefail
          cd ${{ github.workspace }}

          rm -rf anykernel
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel

          # Locate kernel image
          BOOT="$KERNEL_ROOT/out/arch/arm64/boot"
          KERNEL_IMAGE=""
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT/$f" ]; then KERNEL_IMAGE="$BOOT/$f"; break; fi
          done
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: kernel image not found in $BOOT"
            exit 1
          fi
          echo "Found kernel image at: $KERNEL_IMAGE"
          cp "$KERNEL_IMAGE" "anykernel/$(basename "$KERNEL_IMAGE")"

          # Stage modules
          MODDIR=anykernel/modules/vendor/lib/modules
          mkdir -p "$MODDIR"

          # Out-of-tree driver (built name is 88XXau.ko; also copy under the name you expected)
          cp "$KERNEL_ROOT/drivers/rtl8812au/88XXau.ko" "$MODDIR/88XXau.ko"
          cp "$KERNEL_ROOT/drivers/rtl8812au/88XXau.ko" "$MODDIR/rtl88XXau.ko"

          # In-tree modules (if any)
          find "$KERNEL_ROOT/out" -name "*.ko" -exec cp {} "$MODDIR/" \;

          echo "Files staged in AnyKernel3 modules:"
          ls -la "$MODDIR"

          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/device\.name1=.*/device.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh

          rm -rf .git
          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *
          cd ${{ github.workspace }}

          mkdir -p final_zip
          mv SM-T290-Lineage20-AnyKernel3-iam_devu.zip final_zip/

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: final_zip/*.zip

      - name: Upload Driver Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-build-log
          path: rtl8812au-build.log
          if-no-files-found: ignore
