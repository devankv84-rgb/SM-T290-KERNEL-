name: Build SM-T290 Kernel from Drive (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          
      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Cross-Compilers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          pip install --upgrade pip
          pip install gdown

      - name: Download and Extract Kernel Source
        run: |
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          echo "Downloading kernel source zip via gdown..."
          
          # Force download bypassing the Google Drive large file virus scan warning confirmation page
          gdown --fuzzy "https://google.com" -O kernel-source.zip
          
          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source
          
          # Standardize folder layout so we don't guess paths in subsequent steps
          if [ -d kernel-source/*-gtowifi* ] || [ -d kernel-source/android_* ]; then
            mv kernel-source/*/* kernel-source/ 2>/dev/null || true
          fi

      - name: Clone Toolchain & Realtek Driver
        run: |
          git clone --depth=1 https://github.com toolchain-clang
          git clone --depth=1 https://github.com kernel-source/drivers/net/wireless/rtl8812au

      - name: Compile Kernel Image and Realtek Module
        run: |
          cd kernel-source
          
          # Fix working paths
          export PATH="${{ github.workspace }}/toolchain-clang/bin:$PATH"
          
          # Cross-compile flag setups
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -Wno-unused-command-line-argument"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          
          mkdir -p out
          echo "-iam_devu" > localversion
          
          # 1. Generate base configurations from defconfig
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # 2. Append Network & MAC capability configurations safely
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=m/g' out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config
          
          # 3. AUTO-ACCEPT NEW SUB-CONFIG PROMPTS (Fixes the Minstrel Abort Error)
          make O=out ARCH=arm64 olddefconfig
          
          # Inject stability fixes into legacy device staging areas
          if [ -f drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c ]; then
            sed -i '/#include "macTrace.h"/a #define P2P_NOT_ACTIVE 0\n#define P2P_GO_NEG_PROCESS 1\n#define P2P_GO_NEG_COMPLETED 2\n#define P2P_CLIENT_CONNECTING_STATE_1 3\n#define P2P_GO_COMPLETED_STATE 4\n#define P2P_CLIENT_CONNECTED_STATE_1 5\n#define P2P_CLIENT_DISCONNECTED_STATE 6\n#define P2P_CLIENT_CONNECTING_STATE_2 7\n#define P2P_CLIENT_COMPLETED_STATE 8' drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c
          fi
          
          # Step 1: Compile base kernel tree 
          make -j$(nproc) O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Step 2: Compile native modules
          make -j$(nproc) O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- modules
          
          # Step 3: Compile Realtek module cleanly using proper environment indicators
          cd drivers/net/wireless/rtl8812au
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KSRC="${{ github.workspace }}/kernel-source/out" modules

      - name: Package with AnyKernel3 (Systemless Injection Layer)
        run: |
          git clone https://github.com -b master anykernel
          
          # Grab compiled image
          KERNEL_IMAGE=$(find kernel-source/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp "$KERNEL_IMAGE" anykernel/Image.gz
          
          # Setup modules location inside update container template wrapper
          mkdir -p anykernel/modules/vendor/lib/modules/
          find kernel-source -name "*.ko" -exec cp {} anykernel/modules/vendor/lib/modules/ \;
          
          # Update structural logic settings for dynamic target partition updates
          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/g' anykernel.sh   # Enables systemless overlay creation
          sed -i 's/device\.name1=.*/device\.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: ./*.zip
          
