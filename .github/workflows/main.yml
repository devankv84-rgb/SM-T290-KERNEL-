name: Build SM-T290 Kernel - NetHunter & rtl88xxau

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Cross-Compilers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          pip install --upgrade pip
          pip install gdown

      - name: Download Kernel Source Zip from Google Drive
        run: |
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          gdown "https://drive.google.com/uc?id=$FILE_ID" -O kernel-source.zip
          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source

      - name: Clone LineageOS Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain-clang

      - name: Inject NetHunter Patches & rtl88xxau Driver
        run: |
          cd kernel-source/* || cd kernel-source
          
          # Clone rtl88xxau driver and integrate into source tree
          git clone --depth=1 https://github.com/aircrack-ng/rtl88xxau.git drivers/net/wireless/rtl88xxau
          echo 'obj-$(CONFIG_RTL88XXAU) += rtl88xxau/' >> drivers/net/wireless/Makefile
          echo 'source "drivers/net/wireless/rtl88xxau/Kconfig"' >> drivers/net/wireless/Kconfig

      - name: Compile Kernel
        run: |
          cd kernel-source/* || cd kernel-source
          
          CLANG_PATH="${{ github.workspace }}/toolchain-clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w"
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          
          mkdir -p out
          echo "-iam_devu" > localversion
          
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # Enforce compatibility and NetHunter/rtl88xxau configuration flags
          echo "Enforcing configuration parameters..."
          grep -q "CONFIG_COMPAT=y" out/.config || echo "CONFIG_COMPAT=y" >> out/.config
          grep -q "CONFIG_SYSVIPC_COMPAT=y" out/.config || echo "CONFIG_SYSVIPC_COMPAT=y" >> out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_CFG80211_INTERNAL_REGDB=y" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config
          echo "CONFIG_MAC80211_LEDS=y" >> out/.config
          echo "CONFIG_RTL88XXAU=m" >> out/.config
          echo "CONFIG_USB_HID=y" >> out/.config
          echo "CONFIG_USB_GADGET=y" >> out/.config
          
          make -j$(nproc) O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 modules

      - name: Package Kernel & Modules
        run: |
          mkdir -p compiled_output/modules
          find kernel-source -name "Image.gz" -exec cp {} compiled_output/ \; || true
          find kernel-source -name "Image" -exec cp {} compiled_output/ \; || true
          find kernel-source -name "*.ko" -exec cp {} compiled_output/modules/ \; || true
          find kernel-source -name "*.dtb" -exec cat {} + > compiled_output/dtb || true

      - name: Package with AnyKernel3 & Firmware
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
          
          if [ -f "compiled_output/Image.gz" ]; then
            cp compiled_output/Image.gz anykernel/
          else
            cp compiled_output/Image anykernel/
          }
          
          if [ -f "compiled_output/dtb" ]; then
            cp compiled_output/dtb anykernel/
          fi
          
          # Copy built modules into AnyKernel3 modules directory if any exist
          if [ "$(ls -A compiled_output/modules)" ]; then
            mkdir -p anykernel/modules/system/lib/modules
            cp compiled_output/modules/*.ko anykernel/modules/system/lib/modules/
          fi
          
          # Download Realtek firmware binaries for rtl88xxau
          mkdir -p anykernel/firmware/rtlwifi
          wget -O anykernel/firmware/rtlwifi/rtl8812aufw.bin https://raw.githubusercontent.com/minimum2scp/firmware-ralink/master/rtlwifi/rtl8812aufw.bin || true
          
          cd anykernel
          sed -i 's/device\.name1=.*/device\.name1 = gtowifi/g' anykernel.sh
          sed -i 's/block=.*/block = \/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../SM-T290-NetHunter-AnyKernel3-iam_devu.zip *
          cd ..
          
          mkdir -p final_zip
          mv SM-T290-NetHunter-AnyKernel3-iam_devu.zip final_zip/

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-NetHunter-AnyKernel3-iam_devu
          path: final_zip/*.zip
          
