name: Build Android Kernel with RTL8812AU Support

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub Actions tab

env:
  ARCH: arm64
  DEFCONFIG_NAME: lineageos_gtowifi_defconfig
  CUSTOM_NAME: "-iam_devu"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Target Kernel Branch
        uses: actions/checkout@v4
        with:
          repository: devankv84-rgb/android_kernel_samsung_sdm429
          ref: lineage-20

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
            bison flex libelf-dev texinfo unzip ccache acpica-tools

      - name: Download Toolchains (64-bit GCC 4.9 & Official Google 32-bit NDK r14)
        run: |
          # 1. Clone 64-bit toolchain
          git clone --depth=1 "https://github.com/xiangfeidexiaohuo/GCC-4.9" ${{ github.workspace }}/toolchain-64
          
          # 2. Clone official Google 32-bit ARM toolchain (NDK r14 release branch)
          git clone --depth=1 -b ndk-r14-release "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9" ${{ github.workspace }}/toolchain-32
          
          # 3. Expose both bin directories globally to GITHUB_PATH
          echo "${{ github.workspace }}/toolchain-64/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/toolchain-32/bin" >> $GITHUB_PATH

      - name: Clone Your RTL8812AU Repository Branch
        run: |
          # Clones directly into the rtl8812au directory
          git clone --depth=1 -b v5.2.20 "https://github.com/devankv84-rgb/rtl8812au" rtl8812au

      - name: Inject Out-of-Tree & Wireless Configurations
        run: |
          CONFIG_FILE=$(find arch/arm64/configs -name "${{ env.DEFCONFIG_NAME }}" | head -n 1)

          if [ -z "$CONFIG_FILE" ] || [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Config file ${{ env.DEFCONFIG_NAME }} not found!"
            find arch/arm64/configs -name "*defconfig"
            exit 1
          fi

          echo "Found config file at: $CONFIG_FILE"
          echo "Injecting modular, wireless, and camera-disable definitions into $CONFIG_FILE..."
          
          # Fix the module blocker variables found in the root Makefile
          sed -i 's/KBUILD_MODULES :=/KBUILD_MODULES := 1/g' Makefile

          # Force set required configurations for external modules, wireless, and skipping camera
          cat <<EOF >> "$CONFIG_FILE"
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          # CONFIG_MODULE_SIG is not set
          # CONFIG_MODULE_SIG_FORCE is not set
          CONFIG_NETDEVICES=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
          CONFIG_USB=y
          CONFIG_USB_SUPPORT=y
          CONFIG_PRONTO_WLAN=m
          # Disable Camera subsystem to skip build errors
          # CONFIG_MSMB_CAMERA is not set
          # CONFIG_MSMB_CAMERA_SENSOR is not set
          EOF

      - name: Configure and Generate .config
        run: |
          # Verify both compiler binaries are visible
          which aarch64-linux-android-gcc
          which arm-linux-androideabi-gcc

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make ${{ env.DEFCONFIG_NAME }}
          make olddefconfig

      - name: Fix Bluetooth Header Include Paths
        run: |
          BT_MAKEFILE="drivers/bluetooth/Makefile"
          if [ -f "$BT_MAKEFILE" ]; then
            echo "Injecting ccflags include path into $BT_MAKEFILE..."
            echo "ccflags-y += -I\$(srctree)/drivers/bluetooth" >> "$BT_MAKEFILE"
          else
            echo "WARNING: drivers/bluetooth/Makefile not found!"
          fi

      - name: Fix KGSL Trace Include Paths
        run: |
          TRACE_FILE="drivers/gpu/msm/kgsl_trace.h"
          if [ -f "$TRACE_FILE" ]; then
            echo "Ensuring TRACE_INCLUDE_PATH is set to dot in $TRACE_FILE..."
            sed -i 's|#define TRACE_INCLUDE_PATH drivers/gpu/msm|#define TRACE_INCLUDE_PATH \.|g' "$TRACE_FILE"
          fi

          KGSL_MAKEFILE="drivers/gpu/msm/Makefile"
          if [ -f "$KGSL_MAKEFILE" ]; then
            echo "Injecting ccflags include path into $KGSL_MAKEFILE..."
            echo "ccflags-y += -I\$(srctree)/drivers/gpu/msm" >> "$KGSL_MAKEFILE"
          else
            echo "WARNING: drivers/gpu/msm/Makefile not found!"
          fi

      - name: Fix RNDIS IPA Trace Include Paths
        run: |
          IPA_TRACE_FILE="drivers/platform/msm/ipa/ipa_clients/rndis_ipa_trace.h"
          if [ -f "$IPA_TRACE_FILE" ]; then
            echo "Ensuring TRACE_INCLUDE_PATH is set to dot in $IPA_TRACE_FILE..."
            sed -i 's|#define TRACE_INCLUDE_PATH drivers/platform/msm/ipa/ipa_clients|#define TRACE_INCLUDE_PATH \.|g' "$IPA_TRACE_FILE"
          fi

          IPA_MAKEFILE="drivers/platform/msm/ipa/ipa_clients/Makefile"
          if [ -f "$IPA_MAKEFILE" ]; then
            echo "Injecting ccflags include path into $IPA_MAKEFILE..."
            echo "ccflags-y += -I\$(srctree)/drivers/platform/msm/ipa/ipa_clients" >> "$IPA_MAKEFILE"
          else
            echo "WARNING: drivers/platform/msm/ipa/ipa_clients/Makefile not found!"
          fi

      - name: Compile Monolithic Kernel & Internal Modules
        run: |
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          # Added KCFLAGS to treat warnings as non-fatal
          make -j$(nproc) LOCALVERSION=${{ env.CUSTOM_NAME }} KCFLAGS="-Wno-error" modules_prepare dtbs all modules

      - name: Compile External RTL8812AU Module
        run: |
          export CROSS_COMPILE=aarch64-linux-android-
          cd rtl8812au
          # Compile the driver mapping build markers directly to your active kernel tree workspace
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- LOCALVERSION=${{ env.CUSTOM_NAME }} KSRC=${{ github.workspace }}

      - name: Upload Kernel Image & Driver Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-And-Drivers
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image-dtb
            arch/arm64/boot/Image.gz-dtb
            drivers/staging/prima/*.ko
            drivers/staging/qcacld-2.0/*.ko
            rtl8812au/*.ko
          if-no-files-found: warn
