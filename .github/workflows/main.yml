name: Build SM-T290 Kernel from Drive Zip (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID or Share Link'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'sdm429_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            git \
            wget \
            zip \
            unzip \
            lzop \
            perl \
            rsync \
            kmod \
            device-tree-compiler \
            ccache \
            python3

      - name: Download Kernel Source Zip from Google Drive
        run: |
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          echo "Downloading kernel source zip from Google Drive..."
          
          # Handle large files with confirmation token check from Google Drive
          CONFIRM_URL=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate -qO- "https://docs.google.com/uc?export=download&id=$FILE_ID" | grep -oP 'confirm=[a-zA-Z0-9_]+' || true)
          
          if [ -n "$CONFIRM_URL" ]; then
            wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(echo $CONFIRM_URL | cut -d'=' -f2)&id=$FILE_ID" -O kernel-source.zip
          else
            wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=$FILE_ID" -O kernel-source.zip
          fi
          
          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source
          ls -la kernel-source

      - name: Clone Toolchain (AOSP Clang)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/ -b android-11.0_r0.1 toolchain-clang

      - name: Compile Kernel
        run: |
          # Navigate into the extracted source root (handling potential nested folders)
          cd kernel-source/* || cd kernel-source
          
          CLANG_PATH="${{ github.workspace }}/toolchain-clang/clang-r383902b/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w"
          
          mkdir -p out
          
          # Generate Defconfig for sdm429
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # Enforce CONFIG_COMPAT for mixed 32/64-bit architecture stability
          echo "Enforcing CONFIG_COMPAT parameters..."
          grep -q "CONFIG_COMPAT=y" out/.config || echo "CONFIG_COMPAT=y" >> out/.config
          grep -q "CONFIG_SYSVIPC_COMPAT=y" out/.config || echo "CONFIG_SYSVIPC_COMPAT=y" >> out/.config
          
          # Build kernel with Clang and Android cross-compilers
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package Kernel Output
        run: |
          mkdir -p compiled_output
          
          # Find and copy the built image
          if [ -f "kernel-source/*/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/*/out/arch/arm64/boot/Image.gz compiled_output/
          elif [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz compiled_output/
          elif [ -f "kernel-source/out/arch/arm64/boot/Image" ]; then
            cp kernel-source/out/arch/arm64/boot/Image compiled_output/
          else
            echo "Error: Compiled kernel image not found!"
            exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-Kernel
          path: compiled_output/*
          
