name: Build SM-T290 Kernel from Source (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      kernel_gdrive_id:
        description: 'Google Drive File ID for Kernel Source'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      driver_gdrive_id:
        description: 'Google Drive File ID for RTL Driver Source'
        required: true
        default: '1fPtjtxmJ6ZuG_16wzKlmZlYEYB3EedYh'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & System Clang Compiler
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld
          pip install --no-cache-dir gdown

      - name: Download and Extract Sources from Google Drive
        run: |
          # 1. Download and extract Kernel Source
          mkdir -p kernel-source-temp kernel-source
          gdown '${{ github.event.inputs.kernel_gdrive_id }}' -O kernel-source.zip
          unzip -q kernel-source.zip -d kernel-source-temp
          shopt -s dotglob
          mv kernel-source-temp/*/* kernel-source/ 2>/dev/null || mv kernel-source-temp/* kernel-source/
          rm -rf kernel-source-temp kernel-source.zip

          # 2. Download and extract RTL Driver Source
          mkdir -p rtl-temp rtl8812au
          gdown '${{ github.event.inputs.driver_gdrive_id }}' -O rtl-driver.zip
          unzip -q rtl-driver.zip -d rtl-temp
          mv rtl-temp/*/* rtl8812au/ 2>/dev/null || mv rtl-temp/* rtl8812au/
          rm -rf rtl-temp rtl-driver.zip

      # ---------------------------------------------------------------
      # FIX 2: teach the kernel's arm64 module loader about
      # R_AARCH64_ADR_PREL_PG_HI21 (RELA type 275, the ADRP relocation).
      # Skips automatically if the kernel already handles it.
      # ---------------------------------------------------------------
      - name: Patch arm64 Module Loader for ADRP Relocations
        run: |
          cd kernel-source
          python3 - << 'PYEOF'
          import re, sys

          path = "arch/arm64/kernel/module.c"
          src = open(path).read()

          if "R_AARCH64_ADR_PREL_PG_HI21" in src:
              print("module.c already handles R_AARCH64_ADR_PREL_PG_HI21, nothing to patch")
              sys.exit(0)

          missing = [s for s in ("RELOC_OP_PAGE", "reloc_insn_imm", "AARCH64_INSN_IMM_ADR") if s not in src]
          if missing:
              print("ERROR: module.c lacks helpers needed for the patch: %s" % ", ".join(missing))
              print("This kernel needs a manual backport of the ADRP relocation support.")
              sys.exit(1)

          start = src.find("apply_relocate_add")
          if start < 0:
              print("ERROR: apply_relocate_add() not found in module.c")
              sys.exit(1)

          # First 'default:' label after apply_relocate_add() starts = end of its reloc switch
          m = re.compile(r"\n([ \t]+)default:\n").search(src, start)
          if not m:
              print("ERROR: could not locate the relocation switch 'default:' label")
              sys.exit(1)

          indent = m.group(1)
          body = indent + "\t"
          lines = []
          if "overflow_check" in src:
              lines += [
                  indent + "case R_AARCH64_ADR_PREL_PG_HI21_NC:",
                  body + "overflow_check = false;",
                  body + "/* fall through */",
              ]
          lines += [
              indent + "case R_AARCH64_ADR_PREL_PG_HI21:",
              body + "ovf = reloc_insn_imm(RELOC_OP_PAGE, loc, val, 12, 21,",
              body + "\t\t\t     AARCH64_INSN_IMM_ADR);",
              body + "break;",
          ]
          insert = "\n" + "\n".join(lines)

          pos = m.start()
          src = src[:pos] + insert + src[pos:]
          open(path, "w").write(src)
          print("Patched module.c: added R_AARCH64_ADR_PREL_PG_HI21 handling")
          PYEOF

          echo "=== Relocation cases now present in module.c ==="
          grep -n "R_AARCH64_ADR_PREL_PG_HI21" arch/arm64/kernel/module.c

      - name: Verify Kernel Supports Module PLTs
        run: |
          cd kernel-source
          if grep -q "ARM64_MODULE_PLTS" arch/arm64/Kconfig; then
            echo "CONFIG_ARM64_MODULE_PLTS is available in this kernel"
          else
            echo "WARNING: arch/arm64/Kconfig has no ARM64_MODULE_PLTS option."
            echo "PLT support would have to be backported (module-plts.c, module.lds)."
          fi

      # ---------------------------------------------------------------
      # FIX 1: removed -mcmodel=large and --pic-veneer from the driver
      # (PLT support is enabled in the kernel config instead).
      # ---------------------------------------------------------------
      - name: Configure RTL Driver Makefile and Patches
        run: |
          cd rtl8812au
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile || true
          sed -i 's/CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/g' Makefile || true
          sed -i -E 's/^([[:space:]]*)obj-\$\([A-Za-z0-9_]+\)[[:space:]]*[+:]?=/\1obj-m +=/' Makefile || true

          # Standard small code model (kernel default). No -mcmodel=large, no --pic-veneer.
          echo "EXTRA_CFLAGS += -fno-stack-protector -Wno-implicit-function-declaration" >> Makefile

          # Append stub definitions for unexported symbols
          cat << 'EOF' >> os_dep/linux/os_intfs.c

          /* Stub definitions for unexported symbols */
          void rtw_hal_pno_random_gen_mac_addr(void *adapter) { }
          void rtw_hal_set_hw_mac_addr(void *adapter, void *addr) { }
          void rtw_cfgvendor_rssi_monitor_evt(void *adapter, int len, void *data) { }
          EOF

          if [ -f "core/rtw_ap.c" ]; then
            perl -0pi -e 's/[ \t]*if \(\(psta->auth_len != 0\) && \(psta->pauth_frame != NULL\)\) \{.*?\n[ \t]*\}\n/\t\t\/* removed: auth_len\/pauth_frame not present in this build *\/\n/s' core/rtw_ap.c
          fi
          if [ -f "include/rtw_mlme_ext.h" ]; then
            perl -pi -e 's/#define NL80211_AUTHTYPE_SAE 4/#ifndef NL80211_AUTHTYPE_SAE\n#define NL80211_AUTHTYPE_SAE 4\n#endif/g' include/rtw_mlme_ext.h
          fi
          if [ -f "os_dep/linux/ioctl_cfg80211.c" ]; then
            perl -0pi -e 's/cfg80211_roamed\s*\([\s\S]*?\);/struct cfg80211_roam_info roam_info = {0};\n\t\tcfg80211_roamed(padapter->pnetdev, &roam_info, GFP_ATOMIC);/g' os_dep/linux/ioctl_cfg80211.c
          fi
          if [ -f "core/rtw_br_ext.c" ]; then
            perl -0pi -e 's/#include <net\/ip.h>/#include <net\/ip.h>\n#ifndef IPX_NODE_LEN\n#define IPX_NODE_LEN 6\nstruct ipx_addr {\n\t__be32 net;\n\t__u8 node[IPX_NODE_LEN];\n\t__be16 sock;\n};\nstruct ipxhdr {\n\t__be16 ipx_checksum;\n\t__be16 ipx_pktsize;\n\t__u8 ipx_tcnt;\n\t__u8 ipx_type;\n\tstruct ipx_addr ipx_source;\n\tstruct ipx_addr ipx_dest;\n};\n#endif/s' core/rtw_br_ext.c
          fi

      - name: Register RTL8812AU in Kernel Drivers Tree
        run: |
          cd kernel-source
          mkdir -p drivers/net/wireless/realtek/rtl8812au
          cp -r $GITHUB_WORKSPACE/rtl8812au/* drivers/net/wireless/realtek/rtl8812au/

      - name: Compile Core Kernel and Modules
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"

          export HOSTCFLAGS="-w"
          export HOSTCXXFLAGS="-w"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++

          sed -i 's/expr length/expr/g' Makefile 2>/dev/null || true
          mkdir -p out
          echo "-iam_devu" > localversion

          if [ ! -f "arch/arm64/configs/${{ github.event.inputs.defconfig_name }}" ]; then
            echo "ERROR: Defconfig file ${{ github.event.inputs.defconfig_name }} not found in arch/arm64/configs/"
            exit 1
          fi

          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}

          if ! grep -qE "^CONFIG_CFG80211=(y|m)" out/.config; then
            sed -i '/CONFIG_CFG80211/d' out/.config
            echo "CONFIG_CFG80211=m" >> out/.config
          fi
          if grep -q "CONFIG_PRONTO_WLAN" out/.config; then
            sed -i '/CONFIG_PRONTO_WLAN/d' out/.config
            echo "CONFIG_PRONTO_WLAN=m" >> out/.config
          fi
          sed -i '/CONFIG_MODULES[= ]/d' out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config

          # FIX 1: module PLTs let modules branch beyond the +-128MB direct-branch range
          sed -i '/CONFIG_ARM64_MODULE_PLTS/d' out/.config
          echo "CONFIG_ARM64_MODULE_PLTS=y" >> out/.config

          make O=out ARCH=arm64 olddefconfig

          sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' out/.config
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' out/.config
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' out/.config
          sed -i '/CONFIG_MODULE_SIG_ALL/d' out/.config
          echo "# CONFIG_MODULE_SIG is not set" >> out/.config
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> out/.config
          echo "# CONFIG_MODVERSIONS is not set" >> out/.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== Final PLT config ==="
          grep "CONFIG_ARM64_MODULE_PLTS" out/.config || echo "WARNING: CONFIG_ARM64_MODULE_PLTS did not survive olddefconfig (option missing in this kernel)"

          echo "=== STARTING FAST PARALLEL BUILD ==="
          if ! make -j$(nproc) O=out ARCH=arm64; then
            echo "=== FAST BUILD FAILED: RE-RUNNING WITH 1 THREAD TO CAPTURE EXACT ERROR ==="
            make -j1 O=out ARCH=arm64
          fi

          make -j$(nproc) O=out ARCH=arm64 modules

      - name: Compile RTL8812AU Driver Explicitly
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"
          export HOSTCFLAGS="-w"
          export HOSTCXXFLAGS="-w"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++

          make O=out ARCH=arm64 M=drivers/net/wireless/realtek/rtl8812au modules 2>&1 | tee rtl8812au-build.log

      - name: Inspect Driver Relocations
        run: |
          cd kernel-source
          KO=$(find drivers/net/wireless/realtek/rtl8812au out -name "88XXau.ko" 2>/dev/null | head -n1)
          if [ -z "$KO" ]; then
            echo "WARNING: 88XXau.ko not found"
            exit 0
          fi
          echo "Module: $KO"
          echo "ADR_PREL_PG_HI21 relocations (type 275): $(aarch64-linux-gnu-readelf -r "$KO" | grep -c 'R_AARCH64_ADR_PREL_PG_HI21 ' || true)"
          echo "Distinct relocation types in module:"
          aarch64-linux-gnu-readelf -r "$KO" | awk '/^[0-9a-f]+ +[0-9a-f]+ +R_AARCH64/ {print $3}' | sort | uniq -c | sort -rn
          echo "=== Check these types are all handled in module.c ==="
          grep -o "case R_AARCH64_[A-Z0-9_]*" arch/arm64/kernel/module.c | sort -u

      - name: Upload Driver Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-build-log
          path: kernel-source/rtl8812au-build.log
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3

          if [ -f "../kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          fi

          mkdir -p modules/system/lib/modules
          find ../kernel-source/out/ -name "*.ko" -exec cp {} modules/system/lib/modules/ \;
          find ../kernel-source/drivers/net/wireless/realtek/rtl8812au/ -name "*.ko" -exec cp {} modules/system/lib/modules/ \;

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Kernel_SM-T290.zip * -x .git* README.md

      - name: Upload Finished Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_SM-T290-Flashable
          path: Kernel_SM-T290.zip
