name: Build SM-T290 Kernel from Drive (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive File ID'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & Cross-Compilers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            git \
            wget \
            zip \
            unzip \
            lzop \
            perl \
            rsync \
            kmod \
            device-tree-compiler \
            ccache \
            python3 \
            python3-pip \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          
          pip install --upgrade pip
          pip install gdown

      - name: Download Kernel Source Zip from Google Drive
        run: |
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          echo "Downloading kernel source zip via gdown..."
          gdown "https://drive.google.com/uc?id=$FILE_ID" -O kernel-source.zip
          
          ls -lh kernel-source.zip
          
          mkdir -p kernel-source
          unzip -q kernel-source.zip -d kernel-source
          ls -la kernel-source

      - name: Clone LineageOS Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain-clang

      - name: Compile Kernel
        run: |
          cd kernel-source/* || cd kernel-source
          
          CLANG_PATH="${{ github.workspace }}/toolchain-clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w"
          
          # Export cross-compilation toolchain variables explicitly to environment
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          
          mkdir -p out
          
          # Generate Defconfig for lineageos_gtowifi
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # Enforce CONFIG_COMPAT to support the mixed 32/64-bit architecture and avoid bootloops
          echo "Enforcing CONFIG_COMPAT parameters..."
          grep -q "CONFIG_COMPAT=y" out/.config || echo "CONFIG_COMPAT=y" >> out/.config
          grep -q "CONFIG_SYSVIPC_COMPAT=y" out/.config || echo "CONFIG_SYSVIPC_COMPAT=y" >> out/.config
          
          # Build kernel with inherited environment toolchain variables
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Package Kernel Output
        run: |
          mkdir -p compiled_output
          
          # Use robust find command to locate and copy kernel image
          find kernel-source -name "Image.gz" -exec cp {} compiled_output/ \; || true
          find kernel-source -name "Image" -exec cp {} compiled_output/ \; || true
          
          # Verify file was copied successfully
          if [ ! -f "compiled_output/Image.gz" ] && [ ! -f "compiled_output/Image" ]; then
            echo "Error: Compiled kernel image not found anywhere in source tree!"
            exit 1
          fi
          
          ls -la compiled_output/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-Kernel
          path: compiled_output/*
          
