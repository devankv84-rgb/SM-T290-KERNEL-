name: Build SM-T290 Kernel from Source (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      kernel_gdrive_id:
        description: 'Google Drive File ID for Kernel Source'
        required: true
        default: '1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN'
      driver_gdrive_id:
        description: 'Google Drive File ID for RTL Driver Source'
        required: true
        default: '1fPtjtxmJ6ZuG_16wzKlmZlYEYB3EedYh'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & System Clang Compiler
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld
          pip install --no-cache-dir gdown

      - name: Download and Extract Sources from Google Drive
        run: |
          # 1. Download and extract Kernel Source
          mkdir -p kernel-source-temp kernel-source
          gdown '${{ github.event.inputs.kernel_gdrive_id }}' -O kernel-source.zip
          unzip -q kernel-source.zip -d kernel-source-temp
          shopt -s dotglob
          mv kernel-source-temp/*/* kernel-source/ 2>/dev/null || mv kernel-source-temp/* kernel-source/
          rm -rf kernel-source-temp kernel-source.zip

          # 2. Download and extract RTL Driver Source
          mkdir -p rtl-temp rtl8812au
          gdown '${{ github.event.inputs.driver_gdrive_id }}' -O rtl-driver.zip
          unzip -q rtl-driver.zip -d rtl-temp
          mv rtl-temp/*/* rtl8812au/ 2>/dev/null || mv rtl-temp/* rtl8812au/
          rm -rf rtl-temp rtl-driver.zip

      - name: Patch and Configure RTL Driver Makefile
        run: |
          cd rtl8812au
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile || true
          sed -i 's/CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/g' Makefile || true
          sed -i -E 's/^([[:space:]]*)obj-\$\([A-Za-z0-9_]+\)[[:space:]]*[+:]?=/\1obj-m +=/' Makefile || true

          if [ -f "core/rtw_ap.c" ]; then
            perl -0pi -e 's/[ \t]*if \(\(psta->auth_len != 0\) && \(psta->pauth_frame != NULL\)\) \{.*?\n[ \t]*\}\n/\t\t\/* removed: auth_len\/pauth_frame not present in this build *\/\n/s' core/rtw_ap.c
          fi
          if [ -f "include/rtw_mlme_ext.h" ]; then
            perl -pi -e 's/#define NL80211_AUTHTYPE_SAE 4/#ifndef NL80211_AUTHTYPE_SAE\n#define NL80211_AUTHTYPE_SAE 4\n#endif/g' include/rtw_mlme_ext.h
          fi
          if [ -f "os_dep/linux/ioctl_cfg80211.c" ]; then
            perl -0pi -e 's/cfg80211_roamed\s*\([\s\S]*?\);/struct cfg80211_roam_info roam_info = {0};\n\t\tcfg80211_roamed(padapter->pnetdev, &roam_info, GFP_ATOMIC);/g' os_dep/linux/ioctl_cfg80211.c
          fi
          if [ -f "core/rtw_br_ext.c" ]; then
            perl -0pi -e 's/#include <net\/ip.h>/#include <net\/ip.h>\n#ifndef IPX_NODE_LEN\nstruct ipx_addr {\n\t__be32 net;\n\t__u8 node[IPX_NODE_LEN];\n\t__be16 sock;\n};\nstruct ipxhdr {\n\t__be16 ipx_checksum;\n\t__be16 ipx_pktsize;\n\t__u8 ipx_tcnt;\n\t__u8 ipx_type;\n\tstruct ipx_addr ipx_source;\n\tstruct ipx_addr ipx_dest;\n};\n#endif/s' core/rtw_br_ext.c
          fi

      - name: Compile Kernel and In-tree Modules
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++

          sed -i 's/expr length/expr/g' Makefile 2>/dev/null || true
          mkdir -p out
          echo "-iam_devu" > localversion

          if [ ! -f "arch/arm64/configs/${{ github.event.inputs.defconfig_name }}" ]; then
            echo "ERROR: Defconfig file ${{ github.event.inputs.defconfig_name }} not found in arch/arm64/configs/"
            exit 1
          fi

          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}

          if ! grep -qE "^CONFIG_CFG80211=(y|m)" out/.config; then
            sed -i '/CONFIG_CFG80211/d' out/.config
            echo "CONFIG_CFG80211=m" >> out/.config
          fi
          sed -i '/CONFIG_MODULES[= ]/d' out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config

          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64
          make -j$(nproc) O=out ARCH=arm64 modules

      - name: Build 88XXau.ko as External Module
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"

          KSRC="$GITHUB_WORKSPACE/kernel-source"
          KOUT="$KSRC/out"
          DRV="$GITHUB_WORKSPACE/rtl8812au"

          make -C "$KSRC" O="$KOUT" M="$DRV" \
            ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_RTL8812AU_8821AU=m \
            CONFIG_RTL8812AU=m \
            modules 2>&1 | tee modules-88xxau.log

          if ! find "$DRV" -name "88XXau.ko" | grep -q .; then
            echo "ERROR: 88XXau.ko was not produced. See modules-88xxau.log"
            exit 1
          fi

      - name: Upload Driver Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 88xxau-build-log
          path: modules-88xxau.log
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          mkdir -p anykernel
          wget -qO- https://codeload.github.com/osm0sis/AnyKernel3/tar.gz/refs/heads/master \
            | tar -xzC anykernel --strip-components=1

          KERNEL_IMAGE=$(find kernel-source/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp "$KERNEL_IMAGE" anykernel/Image.gz

          mkdir -p anykernel/modules/system/lib/modules/
          find kernel-source/out -name "*.ko" -exec cp {} anykernel/modules/system/lib/modules/ \;
          cp rtl8812au/88XXau.ko anykernel/modules/system/lib/modules/

          echo "Staged modules:"
          ls -la anykernel/modules/system/lib/modules/

          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/g' anykernel.sh
          sed -i 's/device\.name1=.*/device.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh

          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: ./*.zip
          
