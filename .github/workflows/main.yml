name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name from arch/arm64/configs (check the exact name for SM-T290 / gtowifi)"
        required: true
        default: "lineageos_gtowifi_defconfig"

env:
  KERNEL_ID: "1rc_ZbJjmgLEy37pWvefuRTBX15n0DUqN"
  BOOT_ID: "1TwVfFSZzgjS-pY69xuDpTqV3d4SoDKPa"
  VENDOR_ID: "1_Q94B21OjNGms04XNdue30Ezqf2vPFix"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git lz4 xz-utils zstd ccache device-tree-compiler \
            python3 python3-pip wget android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          pip3 install gdown

      - name: Download kernel source, boot.img, vendor.img
        run: |
          mkdir -p work && cd work
          gdown "https://drive.google.com/uc?id=${KERNEL_ID}" -O kernel_src.archive
          gdown "https://drive.google.com/uc?id=${BOOT_ID}"   -O boot.img
          gdown "https://drive.google.com/uc?id=${VENDOR_ID}" -O vendor.img
          ls -lh

      - name: Extract kernel source
        working-directory: work
        run: |
          mkdir -p kernel
          case "$(file -b kernel_src.archive)" in
            Zip*)   unzip -q kernel_src.archive -d kernel ;;
            gzip*)  tar -xzf kernel_src.archive -C kernel ;;
            XZ*)    tar -xJf kernel_src.archive -C kernel ;;
            *)      tar -xf  kernel_src.archive -C kernel ;;
          esac
          # If the archive had a single top-level folder, step into it
          if [ "$(ls -1 kernel | wc -l)" -eq 1 ] && [ -d "kernel/$(ls -1 kernel)" ]; then
            mv kernel/*/* kernel/ 2>/dev/null || true
            mv kernel/*/.[!.]* kernel/ 2>/dev/null || true
          fi
          ls kernel | head -30

      - name: Inspect boot.img and vendor.img
        working-directory: work
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --out unpacked
          echo "---- Stock kernel version ----"
          strings unpacked/kernel | grep -m1 "Linux version" || true
          echo "---- vendor.img ----"
          file vendor.img
          # Convert sparse -> raw if needed (useful for extracting vendor modules later)
          simg2img vendor.img vendor.raw.img 2>/dev/null || cp vendor.img vendor.raw.img

      - name: Get Clang toolchain (works well with 4.9 kernels)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -1

      - name: Patch for modern host GCC (dtc yylloc fix)
        working-directory: work/kernel
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true

      - name: Build kernel
        working-directory: work/kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_ARGS "${{ github.event.inputs.defconfig }}"
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/

      - name: Repack boot.img with new kernel
        working-directory: work
        run: |
          KIMG=$(ls kernel/out/arch/arm64/boot/Image.gz-dtb \
                    kernel/out/arch/arm64/boot/Image.gz \
                    kernel/out/arch/arm64/boot/Image 2>/dev/null | head -n1)
          echo "Using kernel image: $KIMG"
          # unpack_bootimg prints the original mkbootimg arguments; swap in our kernel
          ARGS=$(python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --out unpacked --format=mkbootimg \
                 | sed -E 's# --kernel [^ ]+##')
          eval python3 mkbootimg/mkbootimg.py --kernel "$KIMG" $ARGS -o boot-new.img
          # Samsung bootloader expects this trailer on boot images
          printf 'SEANDROIDENFORCE' >> boot-new.img
          ls -lh boot-new.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            work/boot-new.img
            work/kernel/out/arch/arm64/boot/Image*
            work/kernel/out/arch/arm64/boot/dts/**/*.dtb
            work/kernel/build.log
