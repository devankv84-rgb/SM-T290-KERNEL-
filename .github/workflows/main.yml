name: Build Android Kernel with RTL8812AU Support

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub Actions tab

env:
  ARCH: arm64
  DEFCONFIG_NAME: lineageos_gtowifi_defconfig
  CUSTOM_NAME: "-iam_devu"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Target Kernel Branch
        uses: actions/checkout@v4
        with:
          repository: devankv84-rgb/android_kernel_samsung_sdm429
          ref: lineage-20

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
            bison flex libelf-dev texinfo unzip ccache acpica-tools

      - name: Download Combined GCC 4.9 Toolchain
        run: |
          # Clones the custom combined repository providing structural compiler utilities
          git clone --depth=1 "https://github.com/xiangfeidexiaohuo/GCC-4.9" ${{ github.workspace }}/toolchain
          echo "GCC_PATH=${{ github.workspace }}/toolchain/bin" >> $GITHUB_ENV

      - name: Clone Your RTL8812AU Repository Branch
        run: |
          # Clones directly into the rtl8812au directory
          git clone --depth=1 -b v5.2.20 "https://github.com/devankv84-rgb/rtl8812au" rtl8812au

      - name: Inject Out-of-Tree & Wireless Configurations
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ ! -f "$CONFIG_FILE" ]; then
            if [ -f "arch/arm64/configs/vendor/${{ env.DEFCONFIG_NAME }}" ]; then
              CONFIG_FILE="arch/arm64/configs/vendor/${{ env.DEFCONFIG_NAME }}"
            else
              echo "WARNING: Config file ${{ env.DEFCONFIG_NAME }} not found. Listing available configs for debugging:"
              ls -l arch/arm64/configs/
              exit 1
            fi
          fi
          
          echo "Injecting modular and wireless definitions into $CONFIG_FILE..."
          # Fix the module blocker variables found in the root Makefile
          sed -i 's/KBUILD_MODULES :=/KBUILD_MODULES := 1/g' Makefile

          # Force set required configurations for external modules AND internal pronto wlan
          cat <<EOF >> "$CONFIG_FILE"
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          # CONFIG_MODULE_SIG is not set
          # CONFIG_MODULE_SIG_FORCE is not set
          CONFIG_NETDEVICES=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
          CONFIG_USB=y
          CONFIG_USB_SUPPORT=y
          CONFIG_PRONTO_WLAN=m
          EOF

      - name: Configure and Generate .config
        run: |
          export PATH="${{ env.GCC_PATH }}:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make ${{ env.DEFCONFIG_NAME }}
          make olddefconfig

      - name: Compile Monolithic Kernel & Internal Modules
        run: |
          export PATH="${{ env.GCC_PATH }}:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make -j$(nproc) LOCALVERSION=${{ env.CUSTOM_NAME }} modules_prepare dtbs all modules

      - name: Compile External RTL8812AU Module
        run: |
          export PATH="${{ env.GCC_PATH }}:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          cd rtl8812au
          # Compile the driver mapping build markers directly to your active kernel tree workspace
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- LOCALVERSION=${{ env.CUSTOM_NAME }} KSRC=${{ github.workspace }}

      - name: Upload Kernel Image & Driver Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-And-Drivers
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image-dtb
            arch/arm64/boot/Image.gz-dtb
            drivers/staging/prima/*.ko
            drivers/staging/qcacld-2.0/*.ko
            rtl8812au/*.ko
          if-no-files-found: warn
