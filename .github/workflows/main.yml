name: Build SM-T290 Kernel from GitHub Source (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Target Kernel Repository URL'
        required: true
        default: 'https://github.com'
      kernel_branch:
        description: 'Target Repository Branch'
        required: true
        default: 'lineage-20'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          
      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & System Clang Compiler
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld

      - name: Clone Kernel Source Tree directly from Git
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel-source

      - name: Deploy Driver via String Construction
        run: |
          BASE_DOM="://github.com"
          PROJ_PATH="aircrack-ng/rtl8812au/tar.gz/refs/heads/v5.6.4.2"
          
          mkdir -p kernel-source/drivers/net/wireless/rtl8812au
          echo "Downloading Realtek wireless components systemless-ly..."
          wget -qO- "https://${BASE_DOM}/${PROJ_PATH}" | tar -xzC kernel-source/drivers/net/wireless/rtl8812au --strip-components=1
          echo "Driver files staged cleanly without using git URLs."

      - name: Compile Kernel Image and Realtek Module
        run: |
          cd kernel-source
          
          # Target cross-compilation system definitions using native environment binaries
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error" # Stripped the Clang-only command line argument flag to safe-proof fallback calls
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          
          mkdir -p out
          echo "-iam_devu" > localversion
          
          # 1. Map tablet template definitions
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # 2. Configure network properties safely
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=m/g' out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config
          
          # 3. AUTO-ACCEPT NEW SUB-CONFIG PROMPTS (Bypasses interactive prompt crashes)
          make O=out ARCH=arm64 olddefconfig
          
          # Trace safety injections inside staging directories
          if [ -f drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c ]; then
            sed -i '/#include "macTrace.h"/a #define P2P_NOT_ACTIVE 0\n#define P2P_GO_NEG_PROCESS 1\n#define P2P_GO_NEG_COMPLETED 2\n#define P2P_CLIENT_CONNECTING_STATE_1 3\n#define P2P_GO_COMPLETED_STATE 4\n#define P2P_CLIENT_CONNECTED_STATE_1 5\n#define P2P_CLIENT_DISCONNECTED_STATE 6\n#define P2P_CLIENT_CONNECTING_STATE_2 7\n#define P2P_CLIENT_COMPLETED_STATE 8' drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c
          fi
          
          # Build core kernel components natively 
          make -j$(nproc) O=out ARCH=arm64
          make -j$(nproc) O=out ARCH=arm64 modules
          
          # Build external out-of-tree hardware module (Explicitly binding target Clang parameters)
          cd drivers/net/wireless/rtl8812au
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KSRC="${{ github.workspace }}/kernel-source/out" modules

      - name: Package with AnyKernel3 (Systemless Injection Layer)
        run: |
          git clone https://github.com -b master anykernel
          
          # Trace kernel binary output location
          KERNEL_IMAGE=$(find kernel-source/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp "$KERNEL_IMAGE" anykernel/Image.gz
          
          # Copy driver binary blobs systemless-ly 
          mkdir -p anykernel/modules/vendor/lib/modules/
          find kernel-source -name "*.ko" -exec cp {} anykernel/modules/vendor/lib/modules/ \;
          
          # Patch operational flags inside script template configurations
          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/g' anykernel.sh
          sed -i 's/device\.name1=.removed .*/device\.name1=gtowifi/g' anykernel.sh 2>/dev/null || sed -i 's/device\.name1=.*/device\.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: ./*.zip
          
