name: Build SM-T290 Kernel from GitHub Source (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Target Kernel Repository URL'
        required: true
        default: 'https://github.com'
      kernel_branch:
        description: 'Target Repository Branch'
        required: true
        default: 'lineage-20'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          
      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & System Clang Compiler
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld

      - name: Clone Kernel Source Tree directly from Git
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel-source

      - name: Inject Realtek Driver Natively into Kernel Tree
        run: |
          # Step 1: Create the target wireless staging directory natively inside the kernel framework
          mkdir -p kernel-source/drivers/net/wireless/realtek/rtl8812au
          
          # Step 2: Fetch and extract the targeted Aircrack-ng master code source directly
          HEX_URL=$(printf '\x68\x74\x74\x70\x73\x3a\x2f\x2f\x63\x6f\x64\x65\x6c\x6f\x61\x64\x2e\x67\x69\x74\x68\x75\x62\x2e\x63\x6f\x6d\x2f\x61\x69\x72\x63\x72\x61\x63\x6b\x2d\x6e\x67\x2f\x72\x74\x6c\x38\x38\x31\x32\x61\x75\x2f\x74\x61\x72\x2e\x67\x7a\x2f\x72\x65\x66\x73\x2f\x68\x65\x61\x64\x73\x2f\x76\x35\x2e\x36\x2e\x34\x2e\x32')
          wget -qO- "$HEX_URL" | tar -xzC kernel-source/drivers/net/wireless/realtek/rtl8812au --strip-components=1
          
          # Step 3: Permanently patch the kernel architecture hooks to include the driver automatically
          echo 'obj-$(CONFIG_RTL8812AU) += realtek/rtl8812au/' >> kernel-source/drivers/net/wireless/Makefile
          echo 'source "drivers/net/wireless/realtek/rtl8812au/Kconfig"' >> kernel-source/drivers/net/wireless/Kconfig

      - name: Compile Unified Kernel and Native Modules
        run: |
          cd kernel-source
          
          # Cross-compilation variables setup
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          
          # Fix old layout Makefile text evaluation warning loops
          sed -i 's/expr length/expr/g' Makefile 2>/dev/null || true
          
          mkdir -p out
          echo "-iam_devu" > localversion
          
          # 1. Initialize config layout from base template mapping
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}
          
          # 2. Append Network & Realtek configuration flags directly to master config layer
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=m/g' out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config
          echo "CONFIG_RTL8812AU=m" >> out/.config  # Instructs the build system to generate 8812au.ko cleanly
          
          # 3. Automatically accept all new sub-feature configuration prompts
          make O=out ARCH=arm64 olddefconfig
          
          # Inject legacy device tracing stability definitions safely
          if [ -f drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c ]; then
            sed -i '/#include "macTrace.h"/a #define P2P_NOT_ACTIVE 0\n#define P2P_GO_NEG_PROCESS 1\n#define P2P_GO_NEG_COMPLETED 2\n#define P2P_CLIENT_CONNECTING_STATE_1 3\n#define P2P_GO_COMPLETED_STATE 4\n#define P2P_CLIENT_CONNECTED_STATE_1 5\n#define P2P_CLIENT_DISCONNECTED_STATE 6\n#define P2P_CLIENT_CONNECTING_STATE_2 7\n#define P2P_CLIENT_COMPLETED_STATE 8' drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c
          fi
          
          # Step 4: Build unified kernel image layout
          make -j$(nproc) O=out ARCH=arm64
          
          # Step 5: Build all baked-in modules (Includes the newly added Realtek wireless adapter natively!)
          make -j$(nproc) O=out ARCH=arm64 modules

      - name: Package with AnyKernel3 (Systemless Injection Layer)
        run: |
          git clone https://github.com -b master anykernel
          
          # Trace kernel binary output location
          KERNEL_IMAGE=$(find kernel-source/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp "$KERNEL_IMAGE" anykernel/Image.gz
          
          # Scans and packages all .ko outputs natively built into the modules staging area
          mkdir -p anykernel/modules/vendor/lib/modules/
          find kernel-source/out -name "*.ko" -exec cp {} anykernel/modules/vendor/lib/modules/ \;
          
          # Verify file contents are tracked inside logging wrapper blocks
          echo "Staged binaries for installation deployment package container:"
          ls -la anykernel/modules/vendor/lib/modules/
          
          # Patch configuration layers within anykernel container wrapper
          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/g' anykernel.sh
          sed -i 's/device\.name1=.removed .*/device\.name1=gtowifi/g' anykernel.sh 2>/dev/null || sed -i 's/device\.name1=.*/device\.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: ./*.zip
          
