name: Build SM-T290 Kernel from GitHub Source (LineageOS 20)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Target Kernel Repository URL'
        required: true
        default: 'https://github.com'
      kernel_branch:
        description: 'Target Repository Branch'
        required: true
        default: 'lineage-20'
      defconfig_name:
        description: 'Target Defconfig File'
        required: true
        default: 'lineageos_gtowifi_defconfig'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Install Host Dependencies & System Clang Compiler
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            git wget zip unzip lzop perl rsync kmod device-tree-compiler ccache \
            python3 python3-pip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld

      - name: Clone Kernel Source Tree directly from Git
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel-source

      - name: Fetch Realtek 88XXau Driver Source
        run: |
          mkdir -p rtl8812au
          wget -qO- https://codeload.github.com/aircrack-ng/rtl8812au/tar.gz/refs/heads/v5.6.4.2 \
            | tar -xzC rtl8812au --strip-components=1

          # Configure driver Makefile for Android ARM64 and disable i386
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' rtl8812au/Makefile
          sed -i 's/CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/g' rtl8812au/Makefile || true

          # Force object modules target
          sed -i -E 's/^([[:space:]]*)obj-\$\([A-Za-z0-9_]+\)[[:space:]]*[+:]?=/\1obj-m +=/' rtl8812au/Makefile

          # Patch 1 (rtw_ap.c): ap_free_sta() cleanup block
          perl -0pi -e 's/[ \t]*if \(\(psta->auth_len != 0\) && \(psta->pauth_frame != NULL\)\) \{.*?\n[ \t]*\}\n/\t\t\/* removed: auth_len\/pauth_frame not present in this build *\/\n/s' rtl8812au/core/rtw_ap.c

          # Patch 2: Guard NL80211_AUTHTYPE_SAE against kernel header redefinition
          perl -pi -e 's/#define NL80211_AUTHTYPE_SAE 4/#ifndef NL80211_AUTHTYPE_SAE\n#define NL80211_AUTHTYPE_SAE 4\n#endif/g' rtl8812au/include/rtw_mlme_ext.h

          # Patch 3: Robust cfg80211_roamed signature patch for newer kernels
          perl -0pi -e 's/cfg80211_roamed\s*\([\s\S]*?\);/struct cfg80211_roam_info roam_info = {0};\n\t\tcfg80211_roamed(padapter->pnetdev, &roam_info, GFP_ATOMIC);/g' rtl8812au/os_dep/linux/ioctl_cfg80211.c

      - name: Integrate RTL8812AU In-Tree
        run: |
          mkdir -p kernel-source/drivers/net/wireless/realtek/rtl8812au
          cp -r rtl8812au/* kernel-source/drivers/net/wireless/realtek/rtl8812au/

          if ! grep -q "rtl8812au" kernel-source/drivers/net/wireless/realtek/Kconfig 2>/dev/null; then
            echo 'source "drivers/net/wireless/realtek/rtl8812au/Kconfig"' >> kernel-source/drivers/net/wireless/realtek/Kconfig
          fi

          if ! grep -q "rtl8812au" kernel-source/drivers/net/wireless/realtek/Makefile 2>/dev/null; then
            echo 'obj-$(CONFIG_RTL8812AU) += rtl8812au/' >> kernel-source/drivers/net/wireless/realtek/Makefile
          fi

      - name: Compile Kernel and In-tree Modules
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w -Wno-error -gdwarf-4 -gno-record-gcc-switches"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++

          sed -i 's/expr length/expr/g' Makefile 2>/dev/null || true
          mkdir -p out
          echo "-iam_devu" > localversion

          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig_name }}

          if ! grep -qE "^CONFIG_CFG80211=(y|m)" out/.config; then
            sed -i '/CONFIG_CFG80211/d' out/.config
            echo "CONFIG_CFG80211=m" >> out/.config
          fi
          if ! grep -qE "^CONFIG_RTL8812AU=(y|m)" out/.config; then
            sed -i '/CONFIG_RTL8812AU/d' out/.config
            echo "CONFIG_RTL8812AU=m" >> out/.config
          fi
          sed -i '/CONFIG_MODULES[= ]/d' out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_COMPAT=y" >> out/.config

          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64
          make -j$(nproc) O=out ARCH=arm64 modules

      - name: Package with AnyKernel3
        run: |
          mkdir -p anykernel
          wget -qO- https://codeload.github.com/osm0sis/AnyKernel3/tar.gz/refs/heads/master \
            | tar -xzC anykernel --strip-components=1

          KERNEL_IMAGE=$(find kernel-source/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp "$KERNEL_IMAGE" anykernel/Image.gz

          mkdir -p anykernel/modules/vendor/lib/modules/
          find kernel-source/out -name "*.ko" -exec cp {} anykernel/modules/vendor/lib/modules/ \;

          echo "Staged modules:"
          ls -la anykernel/modules/vendor/lib/modules/

          cd anykernel
          sed -i 's/do.modules=.*/do.modules=1/g' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/g' anykernel.sh
          sed -i 's/device\.name1=.*/device.name1=gtowifi/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh

          zip -r9 ../SM-T290-Lineage20-AnyKernel3-iam_devu.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T290-Lineage20-AnyKernel3-iam_devu
          path: ./*.zip
          
